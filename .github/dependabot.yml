version: 2
updates:
  - package-ecosystem: pub
    directory: /
    # dev is the integration branch; main only fast-forwards to a green dev
    # commit (docs/RELEASING.md §3), so update PRs never target main.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # 0.7 needs Dart ^3.14; CI pins Flutter 3.44.6, which ships
      # Dart 3.12.2. Remove with the Flutter SDK bump task.
      - dependency-name: window_manager
        versions: [">=0.7.0"]
      # 11 needs Dart ^3.13; CI pins Flutter 3.44.6, which ships
      # Dart 3.12.2. Remove with the Flutter SDK bump task.
      - dependency-name: very_good_analysis
        versions: [">=11.0.0"]
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
      pub-major:
        update-types: [major]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
