name: Package

# Builds and smoke-tests every package for every target (docs/RELEASING.md).
# Called by ci.yml on pushes to main (unsigned, artifacts only) and by
# release.yml (signed when the secrets exist). Run by hand on dev (or a
# feature branch) before main is fast-forwarded, so a packaging bug never
# costs a red main run (decision D1, docs/briefs/2026-11-19-release-green.md).
# Never publishes anything.
#
# Both triggers declare the same inputs, and every job reads them as
# `inputs.*`, which resolves under workflow_call and workflow_dispatch alike
# (never `github.event.inputs`, which is empty under workflow_call).
#
# Artifacts:
#   pkg-linux, pkg-arch, pkg-windows, pkg-macos   the release assets
#   windows-msix                                  Store submission only
#   aur-pkgbuild                                  filled PKGBUILD + .SRCINFO
on:
  workflow_call:
    inputs:
      sign:
        description: Sign (SignPath, Apple) when the secrets exist
        type: boolean
        default: false
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 14
  workflow_dispatch:
    inputs:
      sign:
        description: Sign (SignPath, Apple) when the secrets exist
        type: boolean
        default: false
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 7

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  linux:
    name: linux packages
    # glibc 2.35: runs on Debian 12 / Ubuntu 22.04 and newer (decision R4).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and packaging dependencies
        # Time limits and retries: the runner's mirror stalls (REL-02).
        run: |
          scripts/apt_retry.sh clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            patchelf rpm dpkg-dev lintian desktop-file-utils file xvfb xauth libgl1-mesa-dri procps
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate desktop file
        run: desktop-file-validate packaging/linux/invoice-desk.desktop
      - name: Build once, package tarball, AppImage, RPM and deb
        env:
          MAX_GLIBC: "2.35"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/package_linux.sh
      - name: Every Linux asset was built
        run: |
          for f in invoice-desk-linux-x64.tar.gz InvoiceDesk-x86_64.AppImage invoice-desk.x86_64.rpm invoice-desk_amd64.deb; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
      # The RPM targets Fedora, so it is linted by Fedora's rpmlint. Ubuntu
      # 22.04's rpmlint 2.2.0 applies Debian-era rules (library-package
      # naming, Group/Packager tags, an old SPDX list) and reports ~40 errors
      # Fedora's doesn't. The build stays on 22.04 (decision R4).
      - name: rpmlint on fedora:latest (accepted findings are filtered in the rpmlintrc)
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w fedora:latest bash -euo pipefail -c '
            dnf -y -q install rpmlint >/dev/null
            rpmlint --version
            rpmlint -r packaging/rpm/invoice-desk.rpmlintrc dist/invoice-desk.x86_64.rpm'
      - name: lintian (accepted findings are package overrides)
        run: lintian --fail-on error,warning dist/invoice-desk_amd64.deb
      - name: Smoke run (tarball)
        run: ./scripts/smoke_linux.sh dist/invoice-desk-linux-x64.tar.gz
      - name: Smoke run (AppImage)
        run: ./scripts/smoke_linux.sh dist/InvoiceDesk-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-linux
          path: |
            dist/invoice-desk-linux-x64.tar.gz
            dist/InvoiceDesk-x86_64.AppImage
            dist/invoice-desk.x86_64.rpm
            dist/invoice-desk_amd64.deb
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-packaging-logs
          path: dist/stage/*.log
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}

  arch:
    name: arch package
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-linux
          path: dist
      - name: makepkg (as a non-root user) and namcap
        run: bash scripts/package_arch.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-arch
          path: dist/invoice-desk-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-pkgbuild
          path: |
            dist/aur/PKGBUILD
            dist/aur/.SRCINFO
          include-hidden-files: true
          retention-days: ${{ inputs.retention-days }}

  linux-install:
    name: install ${{ matrix.image }}
    needs: [linux, arch]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # Worst case of smoke_linux.sh with apt is 1560 s (its header).
    timeout-minutes: 30
    # ubuntu:22.04 depends on Ubuntu's mirrors, which stall for long
    # stretches (docs/worklog/REL-02.md). Its failure must not block
    # release.yml; debian:12 keeps covering the .deb, and a red ubuntu:22.04
    # install is checked by hand before tagging (docs/RELEASING.md).
    continue-on-error: ${{ matrix.image == 'ubuntu:22.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # archive.ubuntu.com stalled this job (docs/worklog/REL-02.md); the
          # runners are on Azure, so the ubuntu container uses Azure's mirror.
          - { image: "ubuntu:22.04", package: invoice-desk_amd64.deb, apt_mirror: "http://azure.archive.ubuntu.com/ubuntu" }
          - { image: "debian:12", package: invoice-desk_amd64.deb }
          - { image: "fedora:latest", package: invoice-desk.x86_64.rpm }
          - { image: "archlinux:latest", package: invoice-desk-x86_64.pkg.tar.zst }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-{linux,arch}
          merge-multiple: true
          path: dist
      - name: Install, launch headless, remove
        env:
          SMOKE_APT_MIRROR: ${{ matrix.apt_mirror || '' }}
        run: bash scripts/smoke_linux.sh "dist/${{ matrix.package }}"
      - name: Non-blocking failure
        if: failure() && matrix.image == 'ubuntu:22.04'
        run: >-
          echo "::warning title=install ubuntu%3A22.04 failed (non-blocking)::Most likely a
          stalled Ubuntu mirror (${{ matrix.apt_mirror }}): see the package manager log
          in the step above. debian:12 covers the .deb; check this one by hand before
          tagging (docs/RELEASING.md)."

  windows:
    name: windows packages
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # SignPath downloads the unsigned artifact
    env:
      HAS_SIGNPATH: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build once; installer, portable zip, MSIX
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/package_windows.ps1

      # ── optional code signing (decision R6) ─────────────────────────────
      - name: Upload the unsigned installer for SignPath
        id: unsigned
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: dist/InvoiceDesk-Setup-x64.exe
          retention-days: 1
      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Use the signed installer
        if: env.HAS_SIGNPATH == 'true'
        run: |
          Copy-Item dist-signed/InvoiceDesk-Setup-x64.exe dist/InvoiceDesk-Setup-x64.exe -Force
          $sig = Get-AuthenticodeSignature dist/InvoiceDesk-Setup-x64.exe
          if ($sig.Status -ne 'Valid') { throw "signature status: $($sig.Status)" }
          Write-Host "signed by $($sig.SignerCertificate.Subject)"
      - name: Unsigned
        if: env.HAS_SIGNPATH != 'true'
        run: Write-Host 'SignPath not configured or signing not requested; the installer ships unsigned.'

      - name: Smoke test (silent install, launch, uninstall; portable zip)
        run: ./scripts/smoke_windows.ps1 -Installer dist/InvoiceDesk-Setup-x64.exe -Zip dist/InvoiceDesk-Windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-windows
          path: |
            dist/InvoiceDesk-Setup-x64.exe
            dist/InvoiceDesk-Windows-x64.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msix
          path: dist/InvoiceDesk-x64.msix
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  macos:
    name: macos package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build, sign + notarize when the Apple secrets exist, dmg
        env:
          MACOS_CERT_P12_BASE64: ${{ inputs.sign && secrets.MACOS_CERT_P12_BASE64 || '' }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: ./scripts/package_macos.sh
      - name: Remove the temporary keychain and key files
        if: always()
        run: ./scripts/package_macos.sh --cleanup
      - name: Smoke test (mount, launch, quit)
        run: ./scripts/smoke_macos.sh dist/InvoiceDesk-macOS.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-macos
          path: dist/InvoiceDesk-macOS.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
