name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  linux:
    name: linux-release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            rpm desktop-file-utils file patchelf

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag ${tag} is not vX.Y.Z"; exit 1; }
          sed -i "s/^version:.*/version: ${version}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Validate desktop file
        run: desktop-file-validate packaging/linux/invoice-desk.desktop

      - name: Build and package (tarball, AppImage, RPM, checksums)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package_linux.sh

      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-logs
          path: dist/stage/*.log
          if-no-files-found: ignore

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=()
          for f in dist/*.tar.gz dist/*.AppImage dist/*.rpm dist/SHA256SUMS.txt; do
            [[ -f "$f" ]] && files+=("$f")
          done
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --draft --title "Invoice Desk ${VERSION}" --generate-notes
