name: CI

# Required on main (ruleset "protect-main"): quality, tests, build.
# Every branch and PR: quality, codegen, schema, tests + coverage, goldens,
# security and a Linux build with a smoke run. Pushes to main also build and
# smoke-test every package for every target (package.yml) as 14-day
# artifacts, so a release is never the first time a package is built.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed --output=none lib test tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Layering
        run: flutter test test/architecture
      - name: File and build-method sizes
        run: dart run tool/check_sizes.dart

  codegen:
    name: codegen freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: build_runner
        run: dart run build_runner build
      - name: gen-l10n
        run: flutter gen-l10n
      - name: Data model doc
        run: dart run tool/gen_data_model.dart --check
      - name: Nothing changed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::generated files are stale; run build_runner / gen-l10n and commit"; git diff --stat; exit 1; }

  schema:
    name: schema guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dump schema and migration helpers
        run: dart run drift_dev make-migrations
      - name: Snapshot matches the code
        run: |
          # A changed schema without a version bump rewrites the current
          # snapshot; a bump without committing creates a new one. Either
          # way the tree is dirty.
          test -z "$(git status --porcelain drift_schemas lib/data/db.steps.dart test/drift)" || {
            echo "::error::schema changed without a committed snapshot/migration test (run dart run drift_dev make-migrations)"
            git status --porcelain drift_schemas lib/data/db.steps.dart test/drift
            exit 1
          }

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tests with coverage (goldens run separately)
        run: flutter test --exclude-tags golden --coverage
      - name: Coverage by layer + gates (core, domain, money, numbering, migrations ≥ 90%)
        run: dart run tool/coverage_report.dart coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info
          retention-days: 14

  goldens:
    name: goldens
    # Pinned image: font rendering differs between runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # App fonts are bundled (assets/fonts); Material icons come from the
      # pinned Flutter SDK. Never --update-goldens in CI.
      - name: Golden tests
        run: flutter test --tags golden
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (secrets in the diff)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: osv-scanner (pubspec.lock)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          echo "3abcfd7126c453a00421487e721b296e0cb68085bd431d6cef60872774170fc8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan --lockfile pubspec.lock
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Licences of shipped dependencies (fail on GPL/AGPL)
        run: dart run tool/check_licenses.dart --markdown

  build-linux:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        # Time limits and retries: the runner's mirror stalls (REL-02).
        run: scripts/apt_retry.sh clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb xauth
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Smoke run (15 s, temp data dir, fail on Dart exceptions)
        run: |
          T=$(mktemp -d)
          set +e
          INVOICE_DESK_DATA_DIR=$T xvfb-run -a timeout -s TERM 15 build/linux/x64/release/bundle/invoice_desk > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log
          test "$rc" -eq 124 || { echo "::error::app exited early (exit $rc)"; exit 1; }
          test -f "$T/invoice_desk.sqlite" || { echo "::error::database was not created"; exit 1; }
          if grep -E "Unhandled Exception|\[ERROR:flutter|Exception caught by" smoke.log; then
            echo "::error::Dart exception during smoke run"; exit 1
          fi

  packages:
    name: packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/package.yml
    with:
      sign: false
      retention-days: 14
    secrets: inherit
