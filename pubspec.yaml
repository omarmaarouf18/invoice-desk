name: invoice_desk
description: Invoice Desk — desktop invoicing for a solo freelancer.
version: 0.4.0+5
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  clock: ^1.1.2
  collection: ^1.19.1
  drift: ^2.35.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  intl: ^0.20.2
  meta: ^1.18.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  # Pinned: resolved from third_party/pdf (patched), see third_party/pdf/README.md.
  pdf: 3.13.1
  printing: ^5.15.1
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  analyzer: ^13.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.3
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

dependency_overrides:
  # Vendored pdf 3.13.1 + RTL advance-width fix (ADR-0013).
  pdf:
    path: third_party/pdf

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
